name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macOS (x86_64)
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux (x86_64)
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux (aarch64)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows (x86_64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows (aarch64)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev libvulkan-dev

      - name: Install NASM (vendored OpenSSL)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install -y nasm
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"

      - name: Install Clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and doc tests
        run: cargo test --workspace --locked -- --skip offscreen_

      - name: Offscreen UI tests
        run: cargo test -p rv-app --locked offscreen_

      - name: Build app
        run: cargo build -p rv-app --locked
